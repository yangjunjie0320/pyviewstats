services:
  monitor:
    build: .
    container_name: viewstats-monitor
    init: true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - cache_vol:/app/.cache
      - /Users/yangjunjie/workspace/pyviewstats/logs:/app/logs
    restart: unless-stopped

volumes:
  cache_vol:

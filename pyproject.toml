[project]
name = "pyviewstats"
version = "0.1.0"
description = "YouTube ranking monitor with Feishu integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pycryptodome>=3.20,<4",
    "diskcache>=5.6,<6",
    "python-dotenv>=1.0,<2",
    "google-genai>=1.0,<2",
    "lark-oapi>=1.4,<2",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call external services",
]
